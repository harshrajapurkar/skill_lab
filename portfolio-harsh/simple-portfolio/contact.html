<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header>
    <h2>My Portfolio</h2>
    <button id="menu-button" aria-label="Open menu">☰</button>
    <nav id="nav-menu">
      <a href="index.html">Home</a><a href="about.html">About</a>
      <a href="projects.html">Projects</a><a class="active" href="contact.html">Contact</a>
    </nav>
  </header>
  <main class="container page">
    <h1>Contact Me</h1>
    <p class="intro">If you would like to contact me, please fill in this form.</p>
    <form id="contact-form" class="card">
      <label for="name">Your Name</label>
      <input type="text" id="name" required placeholder="Enter your name">
      <label for="email">Your Email</label>
      <input type="email" id="email" required placeholder="Enter your email">
      <label for="message">Your Message</label>
      <textarea id="message" rows="5" required placeholder="Write your message"></textarea>
      <button class="button" type="submit">Submit</button>
      <p id="form-message" aria-live="polite"></p>
    </form>
  </main>
  <footer>© <span id="year"></span> Harsh Rajapurkar | My Portfolio</footer>
</body>
</html>
